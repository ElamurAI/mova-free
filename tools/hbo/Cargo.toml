[package]
name = "hbo"
version.workspace = true
edition = "2024"
# license: Elamur Cosmic License (LICENSE.md at the repo root); the trees it learns from are converted from MACULA Hebrew (CC BY 4.0)
publish = false
description = "Ancient (Biblical) Hebrew from raw text: a transparent segmenter (prefixes and suffixes as words, rules and a lexicon learned from MACULA's trees), the data for the GPU parser gparse, and raw text → segment → gparse → CoNLL-U with hbo FEATS."

[dependencies]
unicode-normalization = "0.1.25"
