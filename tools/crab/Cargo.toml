[package]
name = "mova-crab"
version = "0.1.0"
edition = "2021"
description = "Generic bounded worker control, annotation provenance and review orchestration"
license = "LicenseRef-Elamur-Cosmic"
[workspace]
[dependencies]
agent-mova = { path = "../agent-mova" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
