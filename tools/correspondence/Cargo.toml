[package]
name = "mova-correspondence"
version.workspace = true
edition = "2024"
description = "Bounded typed relation correspondence discovery with explicit finite evidence."

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
mova-modelcheck = { path = "../modelcheck" }

[dev-dependencies]
mova-algorithms = { path = "../../algorithms" }
math = { path = "../../math" }
en = { path = "../../en" }
