[package]
name = "mova-modules"
version.workspace = true
edition = "2024"
# license: Elamur Cosmic License (LICENSE.md at the repo root)
publish = false
description = "Mova's add-on modules (docs/modules.md): hash-pinned data packages under their own licences, installed into the data directory from our server over HTTPS or by BitTorrent, never part of the repository or the core binaries. The `mova modules` command."

[lib]
name = "mova_modules"
path = "src/lib.rs"

[[bin]]
name = "mova"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
# SHA-1 only for BitTorrent v1 piece hashes and info hashes (the protocol fixes it); MIT/Apache-2.0
sha1 = "0.11"
