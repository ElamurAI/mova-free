[package]
name = "mova-terminal"
version = "0.1.0"
edition = "2021"
description = "A Mova animal's private LLM terminal: one held interactive session per animal, asked one bounded question at a time"
license = "LicenseRef-Elamur-Cosmic"

[workspace]

[lib]
name = "terminal"
path = "src/lib.rs"

[[bin]]
name = "mova-terminal"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
