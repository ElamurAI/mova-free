[package]
name = "treebanks"
version.workspace = true
edition = "2024"
description = "UD treebanks: release (tgz) → treebanks/cards.tsv (one fact row per treebank: licence, layers, sizes, paper ids from README references ↔ papers library ↔ ACL Anthology) and INDEX.md."

[dependencies]
anyhow = "1"
flate2 = "1"
tar = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
sources = { path = "../sources" }
