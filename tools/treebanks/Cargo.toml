[package]
name = "treebanks"
version.workspace = true
edition = "2024"
description = "UD treebanks: release (tgz) → cards treebanks/<lang>/<treebank>/README.md with size, papers.md (README references ↔ papers/ library ↔ ACL Anthology), indexes."

[dependencies]
anyhow = "1"
flate2 = "1"
tar = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
sources = { path = "../sources" }
