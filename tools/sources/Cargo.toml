[package]
name = "sources"
version.workspace = true
edition = "2024"
description = "Open-source manifests (JSONL) → raw/ layout with SOURCES.md, per-host curl queues, and size/md5/sha1/magic verification."

[dependencies]
anyhow = "1.0.104"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
unicode-normalization = "0.1"
