[package]
name = "mova-nautilus"
version = "0.1.0"
edition = "2024"
description = "Nautilus: Mova's dictionary maker; native dictionary layers from courses and corpora, teacher terminals only behind the operator's word"
license = "LicenseRef-Elamur-Cosmic"

[workspace]

[lib]
name = "nautilus"
path = "src/lib.rs"

[[bin]]
name = "nautilus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
en = { path = "../../en" }
mova-octopus = { path = "../octopus" }
mova-terminal = { path = "../terminal" }
