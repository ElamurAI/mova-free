[package]
name = "wikt-extract"
version.workspace = true
edition = "2024"
description = "English entries of the English Wiktionary from the raw multistream dump, packaged as a Mova add-on dictionary module (CC BY-SA 4.0 + GFDL)."

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
