[package]
name = "mova-whale"
version = "0.1.0"
edition = "2021"
description = "Abstract Whale workers: pinned task queues, one bounded teacher call per task, config-supplied output contracts and versioned bundles"
license = "LicenseRef-Elamur-Cosmic"

[workspace]

[lib]
name = "mova_whale"
path = "src/lib.rs"

[[bin]]
name = "mova-whale"
path = "src/main.rs"

[dependencies]
mova-teacher = { path = "../../teacher" }
mova-crab = { path = "../crab" }
mova-octopus = { path = "../octopus" }
en = { path = "../../en" }
world = { path = "../../world" }
mova-terminal = { path = "../terminal" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
zip = { version = "7.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
