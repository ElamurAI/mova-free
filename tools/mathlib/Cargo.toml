[package]
name = "mathlib"
version.workspace = true
edition = "2024"
description = "Mova math library: arXiv metadata harvesting via OAI-PMH (arXivRaw), a DuckDB catalog, licenses and sizes, a polite downloader for the pilot and textbooks with a manifest (sha256 and license of every file) in the tools/sources format."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
quick-xml = "0.42.0"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
