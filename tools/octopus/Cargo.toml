[package]
name = "mova-octopus"
version = "0.1.0"
edition = "2024"
description = "Bounded native Mova plaintext deputy with read-only tools"
license = "LicenseRef-Elamur-Cosmic"
[workspace]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
en = { path = "../../en" }
world = { path = "../../world" }
mova-crab = { path = "../crab" }
