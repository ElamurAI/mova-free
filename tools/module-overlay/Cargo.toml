[package]
name = "mova-module-overlay"
version = "0.5.0"
edition = "2024"
description = "Bound source customizations into a fresh public Mova source tree without editing upstream"

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
