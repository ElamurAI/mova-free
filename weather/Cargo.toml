[package]
name = "weather"
version.workspace = true
edition = "2024"
description = "Mova weather domain on top of the en graph compressor: typed forecasts and queries, two variants (US °F/mph and international °C/km/h), collectors for NWS and Environment Canada."

[dependencies]
en = { path = "../en" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
ureq = "2"
