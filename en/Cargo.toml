[package]
name = "en"
version.workspace = true
edition = "2024"
# license: Elamur Cosmic License (LICENSE.md at the repo root)
description = "Mova English graph compressor: text → graph (deterministic FSA/table parser) → text (deterministic generator), trained on UD like a model, without neural nets."

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
