[package]
name = "bigbench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Benchmark of exact-arithmetic libraries for math v2: dashu vs num-bigint/num-rational (measurement only, not shipped in the product)."

[dependencies]
dashu = "0.6"
num-bigint = "0.4"
num-bigint-05 = { package = "num-bigint", version = "0.5" }
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
