[package]
name = "math"
version = "0.1.0"
edition = "2024"
# license: as in en — Apache-2.0 with a non-compete clause regarding Anthropic
description = "Mova math: exact rationals, symbolic Expr tree, units with dimension checks and affine temperature, steps and independent checks; English questions → Expr via UD trees from en."

[dependencies]
en = { path = "../en" }
# global level (level 1): verb classes and shortcuts (train/README.md)
global = { path = "../global" }
anyhow = "1.0.104"
# v2: exact arithmetic on big integers and rationals — dashu (MIT OR Apache-2.0), chosen by benchmark (bigbench/)
dashu = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
