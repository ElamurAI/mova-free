[package]
name = "coder"
version = "0.1.0"
edition = "2024"
# license: same as en — Apache-2.0 with a non-compete clause regarding Anthropic
description = "MMM (small language model) learns to code in the mlab language in a \"student — architect\" loop: memory of verified programs, BM25 over lemmas, template adaptation (v0), motivated steps goal → motive → move (v1); Opus as blind judge and architect; the judge is checked against real execution in a sandbox."

[[bin]]
name = "coder"
path = "src/main.rs"

[dependencies]
mlab = { path = "../mlab" }
en = { path = "../en" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
