[package]
name = "en"
version = "0.1.0"
edition = "2024"
# license: Apache-2.0 with a non-compete clause regarding Anthropic — (text before release)
description = "Mova English graph compressor: text → graph (deterministic FSA/table parser) → text (deterministic generator), trained on UD like a model, without neural nets."

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
