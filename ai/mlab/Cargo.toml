[package]
name = "mlab"
version = "0.1.0"
edition = "2024"
# license: as in en — Apache-2.0 with a clause on non-competition with Anthropic
description = "mlab: a computing language in the spirit of MATLAB/Octave (a clean reimplementation from documentation) — lexer, parser, interpreter, f64/logical/char/complex matrices, linear algebra on faer, FFT on rustfft, numerical methods, result-checking gates."

[[bin]]
name = "mlab"
path = "src/main.rs"

[dependencies]
# tests3 (26.09): gamma, erf, erfc — a port of musl/fdlibm (MIT), already in the tree via statrs; Boost.Math data showed
# a loss of accuracy in our own formulas (erf for small x, erfc near 2, gamma for large and negative near integers)
libm = "0.2.16"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
rustfft = "6.4"
statrs = { version = "0.19.1", default-features = false }
vfs = { path = "../vfs" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
