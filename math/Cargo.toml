[package]
name = "math"
version.workspace = true
edition = "2024"
# license: Elamur Cosmic License (LICENSE.md at the repo root)
description = "Mova math: exact rationals, symbolic Expr tree, units with dimension checks and affine temperature, steps and independent checks; English questions → Expr via UD trees from en."

[dependencies]
en = { path = "../en" }
# global level (level 1): verb classes and shortcuts (docs/design-three-levels.md)
global = { path = "../global" }
anyhow = "1.0.104"
# v2: exact arithmetic on big integers and rationals — dashu (MIT OR Apache-2.0), chosen by benchmark (bigbench/)
dashu = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
