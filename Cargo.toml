# One workspace for every crate: `cargo build --release` at the root
# builds everything into target/release/. `peta/`, where present, is internal tooling outside the workspace.
[workspace]
resolver = "2"
members = [
    "algorithms",
    "annot",
    "teacher",
    "coref",
    "en",
    "global",
    "gparse",
    "kg",
    "latex",
    "layers",
    "math",
    "math/bigbench",
    "mlab",
    "mlab/bench",
    "onto",
    "prag",
    "qagen",
    "tools/approx",
    "tools/bench",
    "tools/twin",
    "tools/enrich",
    "tools/modelcheck",
    "tools/correspondence",
    "tools/cycle",
    "tools/db",
    "tools/gutenberg",
    "tools/hbo",
    "tools/jobs",
    "tools/langseg",
    "tools/kaggle",
    "tools/macula",
    "tools/modules",
    "tools/mathlib",
    "tools/ocrfix",
    "tools/parsecmp",
    "tools/roundtrip",
    "tools/translate",
    "tools/school-sents",
    "tools/sources",
    "tools/treeagree",
    "tools/treebanks",
    "tools/value",
    "tools/wikt-count",
    "tools/wikt-idioms",
    "tools/wikt-page",
    "tools/wikt-extract",
    "vfs",
    "wasi-host",
    "yom-hadin",
    "world",
]
# `cargo build` without -p builds these: everything but the CUDA-only GPU parser, so the CPU-only build needs no CUDA.
# gparse builds with `-p gparse` or through `-p world --features gpu`.
default-members = [
    "algorithms",
    "annot",
    "teacher",
    "coref",
    "en",
    "global",
    "kg",
    "latex",
    "layers",
    "math",
    "math/bigbench",
    "mlab",
    "mlab/bench",
    "onto",
    "prag",
    "qagen",
    "tools/approx",
    "tools/bench",
    "tools/twin",
    "tools/enrich",
    "tools/modelcheck",
    "tools/correspondence",
    "tools/cycle",
    "tools/db",
    "tools/gutenberg",
    "tools/hbo",
    "tools/jobs",
    "tools/langseg",
    "tools/kaggle",
    "tools/macula",
    "tools/modules",
    "tools/mathlib",
    "tools/ocrfix",
    "tools/parsecmp",
    "tools/roundtrip",
    "tools/translate",
    "tools/school-sents",
    "tools/sources",
    "tools/treeagree",
    "tools/treebanks",
    "tools/value",
    "tools/wikt-count",
    "tools/wikt-idioms",
    "tools/wikt-page",
    "tools/wikt-extract",
    "vfs",
    "wasi-host",
    "yom-hadin",
    "world",
]
exclude = ["peta"]

[workspace.package]
version = "0.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.mlab]
codegen-units = 4

[profile.release.package.mlab-backend-bench]
codegen-units = 4
