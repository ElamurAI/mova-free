[package]
name = "qagen"
version.workspace = true
edition = "2024"
# license: Elamur Cosmic License (LICENSE.md at the repo root)
publish = false
description = "Mova QA generator (closed): training questions and answers from Opus over paragraphs of public-domain tales — FairytaleQA types, explicit/implicit, anchors on the paragraph's sentences — with gates and a rejection log. Rule v2: an explicit answer is a verbatim span of one anchor sentence; implicit answers made of one anchor's lemmas are flagged."

[dependencies]
prag = { path = "../prag" }
en = { path = "../en" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
